# 소재 사전 — 서식 안내 겸 예시 (2026-09-04 도입, 범용화 2026-09-07)
#
# 무엇인가
#   브랜드가 반복해서 다루는 피사체(수종·품종·제품·메뉴 등)의 '이미지 앵커' 표다. 카드뉴스·숏폼 씬 이미지를
#   만들 때 디렉터 LLM 이 기억에서 형태를 써내면 디테일이 틀린다(실측: 남천을 "손바닥 모양 잎"이라고 적음).
#   표에 있으면 표를 쓰고, 없으면 종전대로 LLM 이 쓴다(fail-open) — 표가 파이프라인을 막지 않는다.
#
#   이 기능은 원예(식물) 브랜드에서 처음 나와 필드 이름이 식물 쪽으로 치우쳐 있다(leaf·flower·fruit 등).
#   식물이 아닌 소재도 그대로 쓸 수 있다 — 필수는 latin 하나뿐이고(비식물이면 영문 표준명을 적는다),
#   나머지 필드는 전부 선택이라 있는 만큼만 채우면 된다. 아래 클래식 머그 예시를 참고.
#
# 어디에 두는가
#   런타임 파일은 브랜드별 `data/species-<slug>.yaml`(범용 모드면 `data/species.yaml`)이고 git 에 올리지 않는다.
#   이 저장소는 브랜드가 정해지기 전의 범용 스튜디오라 시드 데이터를 싣지 않는다 — 브랜드를 만들 때
#   이 파일을 복사해 채우거나, 보관소(/media)에 소재를 올릴 때 붙인 딱지로 자동 축적되게 두면 된다
#   (자동분은 auto: true · verified: false 로 표시된다).
#
# 필드 (name 은 키. latin 만 필수 — 나머지는 있는 만큼 앵커에 쓰인다)
#   latin    학명(속명 종소명). 이미지 모델이 가장 정확하게 알아듣는 이름. 식물이 아닌 소재면 영문 표준명을 넣는다.
#   aliases  검색·키워드·보관소 딱지 표기 변형. 매칭은 부분문자열이라 한 글자·일반어("배", "묘목")는 넣지 않는다.
#   type     분류(침엽/활엽 · 교목/관목 등)
#   leaf     잎 — 잎차례와 모양(가장 자주 틀린다)
#   form     수형·외형
#   flower   꽃 — 시기·색·꽃차례(씬 묘사에 꽃이 나올 때만 앵커에 붙는다)
#   fruit    열매 — 시기·색·모양(씬 묘사에 열매가 나올 때만)
#   note     화면에 나올 때 주의할 점(선택)
#   verified 사람이 형태 묘사를 확인했는가(코드 동작은 안 바꾸고 표시만)
#
# 서술 원칙: 긍정문만 쓴다. "손바닥 모양이 아니다" 같은 부정문은 이미지 모델이 오히려 그 형태를 그린다.
#   무엇이 아닌지 말고 무엇인지만 적는다(테스트가 부정 표현을 잡는다).

species:
  남천:
    latin: Nandina domestica
    aliases: [남천나무]
    type: 활엽 관목(상록성)
    leaf: 2~3회 깃꼴겹잎, 작은잎은 좁은 피침형에 끝이 뾰족
    form: 뿌리에서 가는 줄기가 여러 대 올라오는 다발 수형, 1~2m
    flower: 6~7월, 흰 꽃이 원뿔꽃차례로
    fruit: 가을~겨울, 붉은 구슬 모양이 송이로 달림
    note: 겨울에 잎 전체가 붉게 물드는 것이 가장 큰 특징
    verified: false
  클래식 머그:
    latin: Classic ceramic mug
    type: 도자기 머그컵
    form: 원통형, 손잡이 하나, 350ml
    note: 로고는 손잡이 반대편 정면
    verified: false
