<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 콘텐츠 스튜디오 · 라이트</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel2: #1a2030; --line: #232b3d;
    --fg: #e6e9f0; --dim: #8b95a8; --accent: #5eead4; --accent2: #818cf8;
    --warn: #fbbf24; --bad: #f87171; --ok: #4ade80;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spec { margin-left: auto; color: var(--dim); font-size: 11px; font-family: var(--mono); }
  .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 59px); }
  .main { overflow-y: auto; padding: 20px 24px; }
  .side { border-left: 1px solid var(--line); padding: 18px; overflow-y: auto; background: #0d1119; }
  .composer { display: flex; gap: 8px; margin-bottom: 18px; }
  .composer input { flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .composer button { background: var(--accent); color: #04211d; border: 0; font-weight: 700;
    padding: 0 20px; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .composer button:disabled { opacity: .5; cursor: default; }
  /* 속도 메트릭 히어로 */
  .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .metric .v { font-size: 22px; font-weight: 800; font-family: var(--mono); }
  .metric .k { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .metric.hl .v { color: var(--accent); }
  .agent { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden; }
  .agent .hd { display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    border-bottom: 1px solid var(--line); }
  .agent .hd .em { font-size: 18px; }
  .agent .hd .nm { font-weight: 700; }
  .agent .hd .role { color: var(--dim); font-size: 12px; }
  .agent .hd .badge { margin-left: auto; font-family: var(--mono); font-size: 11px;
    color: var(--dim); background: var(--panel2); padding: 3px 8px; border-radius: 999px; }
  .agent .hd .badge.synth { color: var(--accent2); }
  .agent .body { padding: 12px 14px; white-space: pre-wrap; line-height: 1.55; font-size: 13.5px; }
  .agent .met { padding: 6px 14px 11px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .agent.synthesis { border-color: var(--accent2); }
  .deliverable { background: linear-gradient(180deg,#10241f,#0d1119); border: 1px solid #1f4a40;
    border-radius: 14px; padding: 18px 20px; margin-top: 6px; }
  .deliverable h3 { margin: 0 0 10px; color: var(--accent); }
  .deliverable .body { white-space: pre-wrap; line-height: 1.65; }
  .side h2 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  .log { font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.7; }
  .log .t { color: var(--accent2); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
    background:var(--panel2); color:var(--dim); margin:2px 4px 2px 0; }
  .status { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .status.running { color: var(--warn); }
  .status.done { color: var(--ok); }
  .status.error { color: var(--bad); }
  .empty { color: var(--dim); text-align: center; margin-top: 80px; font-size: 14px; }
  .approval { background:#2a1f0a; border:1px solid var(--warn); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .approval button { background:var(--ok); color:#04210d; border:0; padding:7px 16px; border-radius:8px; font-weight:700; cursor:pointer; margin-right:8px; }
  .approval button.reject { background:var(--bad); color:#2a0808; }
  code { font-family: var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>🏢 AI 콘텐츠 스튜디오</h1>
  <span class="sub">로컬 우선 재구현 · Ollama 직접 · Connect AI 벤치마킹</span>
  <span class="spec" id="spec">…</span>
</header>
<div class="wrap">
  <div class="main">
    <div class="composer">
      <input id="topic" placeholder="주제를 입력하세요 — 예: 로컬 LLM로 멀티에이전트를 빠르게 돌리는 전략" />
      <button id="run">실행</button>
    </div>
    <div class="status" id="status"></div>
    <div id="approval" class="approval" style="display:none"></div>
    <div class="metrics">
      <div class="metric hl"><div class="v" id="m-prompt">–</div><div class="k">평균 프롬프트 토큰 / 호출</div></div>
      <div class="metric hl"><div class="v" id="m-tps">–</div><div class="k">평균 생성 tok/s</div></div>
      <div class="metric"><div class="v" id="m-calls">0</div><div class="k">LLM 호출</div></div>
      <div class="metric"><div class="v" id="m-elapsed">0s</div><div class="k">경과</div></div>
    </div>
    <div id="agents"></div>
    <div id="empty" class="empty">주제를 입력하고 실행하면 에이전트들이 실시간으로 일합니다.</div>
  </div>
  <div class="side">
    <h2>회사</h2>
    <div id="roster"></div>
    <h2 style="margin-top:22px">📚 위키 (제2의 두뇌) <span id="wiki-count" style="color:var(--accent)"></span></h2>
    <div id="wiki" class="log"></div>
    <h2 style="margin-top:22px">로그</h2>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const emojiFor = (id) => ({ceo:'🧭',researcher:'🔍',analyst:'📊',writer:'✍️',critic:'⚖️'}[id] || '🧑‍💼');
let es = null, t0 = 0, timer = null;
const cards = {};       // agent_id -> {el, body, met}
const metrics = [];     // llm_metric payloads

async function loadStatus() {
  try {
    const r = await fetch('/api/llm'); const d = await r.json();
    $('spec').textContent = (d.specs || '') + (d.assignment ? '  ·  ' + d.assignment.reason : '');
    renderRoster(d.assignment);
  } catch {}
}
async function loadCompany(assignment) {
  try {
    const r = await fetch('/api/company'); const c = await r.json();
    const roster = $('roster'); roster.innerHTML = '';
    const all = [c.ceo, ...(c.specialists||[])];
    for (const a of all) {
      const div = document.createElement('div'); div.style.marginBottom='8px';
      div.innerHTML = `<span style="font-size:15px">${a.emoji||emojiFor(a.id)}</span> <b>${a.name}</b>
        <span style="color:var(--dim);font-size:11px">${a.title}</span>
        <div><span class="pill">${a.tier}</span><span class="pill">${a.specialty.slice(0,28)}…</span></div>`;
      roster.appendChild(div);
    }
  } catch {}
}
function renderRoster(assignment){ loadCompany(assignment); }

function addLog(type, msg) {
  const el = $('log');
  el.innerHTML = `<div><span class="t">${type}</span> ${msg||''}</div>` + el.innerHTML;
}
function ensureCard(agentId, model, stage) {
  if (cards[agentId+stage]) return cards[agentId+stage];
  $('empty').style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'agent' + (stage==='synthesis'?' synthesis':'');
  wrap.innerHTML = `<div class="hd"><span class="em">${emojiFor(agentId)}</span>
    <span class="nm">${agentId}</span><span class="role">${stage}</span>
    <span class="badge ${stage==='synthesis'?'synth':''}">${model||''}</span></div>
    <div class="body"></div><div class="met"></div>`;
  $('agents').appendChild(wrap);
  const c = { el: wrap, body: wrap.querySelector('.body'), met: wrap.querySelector('.met') };
  cards[agentId+stage] = c; return c;
}
function setMetrics() {
  if (!metrics.length) return;
  const inAvg = Math.round(metrics.reduce((s,m)=>s+m.prompt_tokens,0)/metrics.length);
  const totMs = metrics.reduce((s,m)=>s+m.total_ms,0);
  const totOut = metrics.reduce((s,m)=>s+m.output_tokens,0);
  $('m-prompt').textContent = inAvg;
  $('m-tps').textContent = totMs>0 ? (totOut/(totMs/1000)).toFixed(1) : '–';
  $('m-calls').textContent = metrics.length;
}
function tickElapsed(){ $('m-elapsed').textContent = ((Date.now()-t0)/1000).toFixed(0)+'s'; }

const handlers = {
  run_started: (p)=>{ addLog('run_started', p.topic); },
  company_started: (p)=>{ addLog('company', p.name); },
  log: (p)=>{ addLog('log', p.message); },
  topic_decomposed: (p)=>{ addLog('분해', (p.subproblems||[]).length+'개 하위문제'); },
  agent_spawned: (p, ev)=>{ ensureCard(p.agent_id, p.model, p.persona?.is_critic?'critique':'work'); },
  agent_thinking: (p, ev)=>{ const stage=stageOf(ev.agent_id); const c=ensureCard(ev.agent_id,'',stage); c.body.textContent += p.delta; },
  synthesis_chunk: (p, ev)=>{ const c=ensureCard(ev.agent_id||'ceo','','synthesis'); c.body.textContent += p.delta; },
  agent_message: (p, ev)=>{ /* 최종 텍스트는 이미 델타로 채워짐 */ },
  llm_metric: (p)=>{ metrics.push(p); setMetrics();
    const c=cards[p.agent_id+p.stage] || cards[p.agent_id+'work'] || cards[p.agent_id+'critique'] || cards[p.agent_id+'synthesis'];
    if (c) c.met.textContent = `in ${p.prompt_tokens} · out ${p.output_tokens} · ${p.tok_per_s} tok/s · ${(p.total_ms/1000).toFixed(1)}s` + (p.truncated?' · ⚠절단':'');
    addLog('metric', `${p.agent_id} ${p.tok_per_s}tok/s (in ${p.prompt_tokens})`); },
  session_digest_written: (p)=>{ addLog('digest', p.path); },
  phase: (p)=>{ addLog('phase', p.phase); },
  team_spawned: (p)=>{ addLog('팀가동', `${p.name} (리드 ${p.lead}, 팀원 ${(p.members||[]).join(',')||'없음'})`); },
  delegation: (p)=>{ addLog('위임', `${p.from} → ${p.to}`); },
  team_deliverable: (p)=>{ addLog('팀산출물', p.team_id); },
  wiki_query: (p, ev)=>{ addLog('📚위키조회', `"${p.q}" → ${(p.hits||[]).length}건`);
    const c=cards[ev.agent_id+'work']; if(c){ c.el.querySelector('.hd').insertAdjacentHTML('beforeend','<span class="badge" style="color:var(--accent)">📚 그라운딩</span>'); } },
  wiki_page_written: (p)=>{ addLog('위키적재', p.title); loadWiki(); },
  tool_used: (p)=>{ addLog('🔧툴', `${p.agent_id}: ${p.tool}`); },
  approval_requested: (p)=>{ const el=$('approval'); el.style.display='block';
    el.innerHTML=`<div><b>⚠️ 승인 요청</b> — ${p.summary} <span style="color:var(--dim)">(${p.action_type})</span></div>
      <div style="margin-top:10px"><button onclick="decide('${p.approval_id}',true)">✓ 승인</button>
      <button class="reject" onclick="decide('${p.approval_id}',false)">✕ 거부</button></div>`;
    addLog('승인요청', p.summary); },
  approval_decided: (p)=>{ $('approval').style.display='none'; addLog('승인결정', (p.approved?'✓승인':'✕거부')+' ('+p.decided_by+')'); },
  error: (p)=>{ $('status').className='status error'; $('status').textContent='오류: '+p.message; },
  run_done: (p)=>{ finish(p.status); loadWiki(); },
};
async function loadWiki() {
  try {
    const r = await fetch('/wiki/pages?limit=8'); const d = await r.json();
    $('wiki-count').textContent = d.total_pages ? `${d.total_pages}p` : '';
    $('wiki').innerHTML = (d.pages||[]).map(p=>
      `<div><span class="t">[${p.category}]</span> ${p.title.slice(0,32)}</div>`).join('') || '<div style="color:var(--dim)">아직 비어있음 — 런이 끝나면 지식이 쌓입니다</div>';
  } catch {}
}
const _stageByAgent = {};
function stageOf(agentId){ return _stageByAgent[agentId] || 'work'; }

function start() {
  const topic = $('topic').value.trim(); if (!topic) return;
  // 초기화
  $('agents').innerHTML=''; $('log').innerHTML=''; Object.keys(cards).forEach(k=>delete cards[k]);
  metrics.length=0; setMetrics(); $('m-prompt').textContent='–'; $('m-tps').textContent='–'; $('m-calls').textContent='0';
  $('run').disabled=true; $('status').className='status running'; $('status').textContent='실행 중…';
  t0=Date.now(); clearInterval(timer); timer=setInterval(tickElapsed,500);
  fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic})})
    .then(r=>r.json()).then(({run_id})=>{
      if(es) es.close();
      es = new EventSource('/api/runs/'+run_id+'/events');
      for (const type of Object.keys(handlers)) {
        es.addEventListener(type, (e)=>{ try{ const ev=JSON.parse(e.data); handlers[type](ev.payload||{}, ev); }catch{} });
      }
      // spawn 시 stage 기록(thinking 라우팅용)
      es.addEventListener('agent_spawned',(e)=>{ try{const ev=JSON.parse(e.data); _stageByAgent[ev.payload.agent_id]= ev.payload.persona?.is_critic?'critique':'work';}catch{} });
      es.addEventListener('run_started',(e)=>{}); // noop, keeps connection types warm
      es.onerror=()=>{};
    }).catch(err=>{ $('status').className='status error'; $('status').textContent='시작 실패: '+err; $('run').disabled=false; });
}
function finish(status){
  clearInterval(timer); tickElapsed(); $('run').disabled=false;
  $('status').className='status '+(status==='ok'?'done':'error');
  $('status').textContent = status==='ok' ? '완료 ✓' : ('종료: '+status);
  if(es) es.close();
}
function decide(id, approved){
  fetch('/approvals/'+id+'/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved})}).catch(()=>{});
  $('approval').style.display='none';
}
window.decide = decide;
$('run').onclick = start;
$('topic').addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
loadStatus();
loadWiki();
</script>
</body>
</html>
